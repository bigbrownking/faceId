server.address=${SERVER_ADDRESS}
server.port=${SERVER_PORT}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
spring.jpa.properties.hibernate.jdbc.time_zone=${JPA_TIME_ZONE}
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=1

minio.endpoint=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

onnx.model-dir=${ONNX_MODEL_DIR}
onnx.detector=${ONNX_DETECTOR}
onnx.recognizer=${ONNX_RECOGNIZER}
onnx.detector-url=${ONNX_DETECTOR_URL}
onnx.recognizer-url=${ONNX_RECOGNIZER_URL}
onnx.intra-op-threads=${ONNX_INTRA_OP_THREADS}
onnx.antispoof=${ONNX_ANTISPOOF}
onnx.antispoof-url=${ONNX_ANTISPOOF_URL}
onnx.live-threshold=${ONNX_LIVE_THRESHOLD}

matching.threshold-version=${MATCHING_THRESHOLD_VERSION}
matching.cosine-threshold=${MATCHING_COSINE_THRESHOLD}
matching.step-up-band=${MATCHING_STEP_UP_BAND}

crypto.kms-key-id=${CRYPTO_KMS_KEY_ID}
crypto.master-key-base64=${CRYPTO_MASTER_KEY_BASE64}

pose.front-yaw-max=${POSE_FRONT_YAW_MAX}
pose.turn-yaw-min=${POSE_TURN_YAW_MIN}
pose.turn-yaw-max=${POSE_TURN_YAW_MAX}
pose.pitch-max=${POSE_PITCH_MAX}
pose.roll-max=${POSE_ROLL_MAX}
pose.min-brightness=${POSE_MIN_BRIGHTNESS}
pose.max-brightness=${POSE_MAX_BRIGHTNESS}
pose.min-blur-variance=${POSE_MIN_BLUR_VARIANCE}

challenge.ttl-seconds=${CHALLENGE_TTL_SECONDS}
challenge.max-attempts=${CHALLENGE_MAX_ATTEMPTS}

face.liveness-mode=${LIVENESS_MODE}
face.embedding-version=${EMBEDDING_VERSION}
face.liveness-version=${LIVENESS_VERSION}

logging.level.org.ktz.faceid=${LOG_LEVEL}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB